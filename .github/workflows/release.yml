name: Build & Release

on:
  push:
    branches:
      - production

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # 1. Build — macOS (arm64 + x64)
  # ──────────────────────────────────────────────
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Write Apple API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > /tmp/apple_api_key.p8
          echo "APPLE_API_KEY=/tmp/apple_api_key.p8" >> $GITHUB_ENV

      - name: Package — macOS arm64 + x64 (signed + notarized)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: /tmp/apple_api_key.p8
          APPLE_API_KEY_ID: "8W6278FNNX"
          APPLE_API_ISSUER: "fef1ea32-c923-4def-b7a6-b11ea69b7fb9"
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 2. Build — Windows (x64)
  # ──────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npx electron-vite build

      - name: Package — Windows x64
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 3. Deploy to production server
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to server
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: release-files/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: release-files/

      - name: List release files
        run: ls -lh release-files/

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote directories
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /var/www/noche/releases"

      - name: Upload release files
        run: |
          rsync -avz --progress \
            release-files/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/noche/releases/

      - name: Upload landing page
        run: |
          rsync -avz \
            landing/index.html \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/noche/
          rsync -avz \
            landing/images/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/noche/images/

      - name: Set file permissions
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod -R 644 /var/www/noche/releases/* && chmod 755 /var/www/noche/releases && chmod 644 /var/www/noche/index.html && chmod -R 644 /var/www/noche/images/* && chmod 755 /var/www/noche/images"

      - name: Reload nginx
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "nginx -t && systemctl reload nginx"

      - name: Notify success
        run: |
          echo "✅ NochePro deployed successfully!"
          echo "🌐 Landing page: https://noche.generale-ci.com"
          echo "📦 Releases: https://noche.generale-ci.com/releases/"

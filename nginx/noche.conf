server {
    listen 80;
    listen [::]:80;
    server_name noche.generale-ci.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name noche.generale-ci.com;

    ssl_certificate     /etc/letsencrypt/live/noche.generale-ci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noche.generale-ci.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/noche;
    index index.html;

    # ── Landing page ──────────────────────────────────────
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Release artifacts & update manifests ──────────────
    location /releases/ {
        autoindex off;

        # No cache for .yml manifests (electron-updater checks frequently)
        location ~* \.yml$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
            default_type text/yaml;
        }

        # Installers: allow CDN/browser cache for 24h
        location ~* \.(exe|dmg|zip)$ {
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Disposition "attachment";
        }

        try_files $uri =404;
    }

    # ── Default ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header X-Content-Type-Options nosniff       always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/plain text/yaml application/json;
    gzip_min_length 256;

    access_log /var/log/nginx/noche_access.log;
    error_log  /var/log/nginx/noche_error.log;
}
